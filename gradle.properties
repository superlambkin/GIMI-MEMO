# gradle.properties
#
# IMPORTANT: This project requires JDK 21 to build.
# Gradle 8.5 does NOT support Java 26+. If you have multiple JDKs,
# set JAVA_HOME to JDK 21, e.g.:
#   export JAVA_HOME=/c/Program\ Files/Eclipse\ Adoptium/jdk-21.0.12.101-hotspot   (Git Bash)
#   set JAVA_HOME=C:\Program Files\Eclipse Adoptium\jdk-21.0.12.101-hotspot         (Windows CMD)
#
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.12.101-hotspot
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
